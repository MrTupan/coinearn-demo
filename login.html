<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — CoinEarn</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-icon" onclick="location.href='index.html'">C</div>
      <div class="auth-title">Welcome back</div>
      <div class="auth-sub">Sign in to your CoinEarn account</div>
    </div>

    <div id="errorBox" class="alert alert-danger" style="display:none;margin-bottom:16px"></div>

    <div class="form-card">
      <form id="loginForm" style="display:flex;flex-direction:column;gap:16px">
        <div class="field">
          <label class="label">Email address</label>
          <input class="input" type="email" id="email" placeholder="you@gmail.com" required>
        </div>
        <div class="field">
          <label class="label">Password</label>
          <input class="input" type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Sign In</button>
      </form>
    </div>

    <p class="text-center text-sm text-muted" style="margin-top:20px">
      Don't have an account? <a href="register.html">Create one free</a>
    </p>
    <p class="text-center text-sm text-muted" style="margin-top:8px">
      <a href="admin-login.html" style="color:var(--muted2)">Admin panel →</a>
    </p>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script>
  requireGuest();

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;
    const btn   = document.getElementById('submitBtn');
    const errBox = document.getElementById('errorBox');

    btn.disabled = true; btn.textContent = 'Signing in...';
    errBox.style.display = 'none';

    setTimeout(() => {
      const result = doLogin(email, pass);
      if (result.ok) {
        window.location.href = 'dashboard.html';
      } else {
        errBox.textContent = result.error;
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }, 600);
  });
</script>
</body>
</html>
