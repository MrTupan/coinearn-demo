<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transactions — CoinEarn</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-logo">
    <div class="logo-icon">C</div>
    <span class="nav-brand">CoinEarn</span>
  </a>
  <div class="nav-links">
    <a href="dashboard.html" class="btn btn-ghost btn-sm">Overview</a>
    <a href="offerwalls.html" class="btn btn-ghost btn-sm">Earn</a>
    <a href="withdraw.html" class="btn btn-ghost btn-sm">Withdraw</a>
    <a href="transactions.html" class="btn btn-ghost btn-sm" style="color:var(--primary)">Transactions</a>
  </div>
  <div class="nav-user">
    <div style="text-align:right">
      <div class="nav-email" id="navEmail"></div>
      <div class="nav-balance" id="navBalance"></div>
    </div>
    <button class="btn btn-outline btn-sm" onclick="doLogout()">Sign out</button>
  </div>
</nav>

<div class="container page" style="max-width:800px">
  <div class="section">
    <h1 style="font-size:26px;font-weight:800;margin-bottom:6px">Transaction History</h1>
    <p class="text-muted text-sm">All your earnings and withdrawals</p>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Date</th>
        <th>Type</th>
        <th class="hide-sm">Note</th>
        <th class="right">Amount</th>
        <th class="right">Status</th>
      </tr></thead>
      <tbody id="txBody"></tbody>
    </table>
  </div>
  <div id="txCount" class="text-right text-xs text-muted" style="margin-top:10px"></div>
</div>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script>
  const user = requireAuth();
  if (user) {
    updateNavBalance();
    const txs = getTxs(user.id);
    const tbody = document.getElementById('txBody');
    if (!txs.length) {
      tbody.innerHTML = '<tr><td colspan="5"><div class="empty"><p>📋</p><p>No transactions yet.<br><span style="font-size:12px">Complete offerwall tasks to start earning coins.</span></p></div></td></tr>';
    } else {
      tbody.innerHTML = txs.map(tx => `
      <tr>
        <td style="color:var(--muted);white-space:nowrap">${tx.date}</td>
        <td style="font-weight:600">${TX_LABELS[tx.type] || tx.type}</td>
        <td class="hide-sm" style="color:var(--muted);font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${tx.note || '—'}</td>
        <td class="right" style="font-weight:800;color:${tx.type.startsWith('CREDIT') ? 'var(--primary)' : 'var(--text)'}">
          ${tx.type.startsWith('CREDIT') ? '+' : '-'}${fmt(tx.amount)} C
        </td>
        <td class="right"><span class="badge ${STATUS_BADGE[tx.status]}">${tx.status}</span></td>
      </tr>`).join('');
      document.getElementById('txCount').textContent = `${txs.length} transaction${txs.length !== 1 ? 's' : ''} total`;
    }
  }
</script>
</body>
</html>
